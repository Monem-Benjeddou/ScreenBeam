# Builds the Mac app (universal) and the Android APK on every push and pull request.
# Pushing a tag like v1.1 also publishes a GitHub Release with both builds attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # v1.1 -> 1.1 for tagged builds; otherwise 0.0-dev
  VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0-dev' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Load release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: the APK is signed with a debug key."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          export VERSION_NAME="${VERSION_NAME#v}"
          # Android only installs updates with a higher versionCode; stay above early local builds.
          export VERSION_CODE=$((1000 + VERSION_CODE))
          ./gradlew --no-daemon assembleRelease lintRelease
          cp app/build/outputs/apk/release/app-release.apk ../ScreenBeam.apk

      - name: Check signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs ScreenBeam.apk | head -3

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ScreenBeam.apk

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Load signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::warning::No MAC_CERT_P12 secret: the app is signed ad hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build universal app
        working-directory: mac
        env:
          VERSION: ${{ env.VERSION_NAME }}
        run: |
          VERSION="${VERSION#v}" ./build-app.sh
          lipo -archs build/ScreenBeam.app/Contents/MacOS/ScreenBeam | grep -q x86_64
          lipo -archs build/ScreenBeam.app/Contents/MacOS/ScreenBeam | grep -q arm64
          codesign --verify --deep --strict build/ScreenBeam.app
          codesign -dvv build/ScreenBeam.app 2>&1 | grep -E "Format|Authority" || true
          ditto -c -k --keepParent build/ScreenBeam.app ../ScreenBeam-mac.zip
          cd .. && shasum -a 256 ScreenBeam-mac.zip | tee ScreenBeam-mac.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            ScreenBeam-mac.zip
            ScreenBeam-mac.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          **Mac** (macOS 14.2 or later, Apple Silicon or Intel). The quickest way to install or update is to paste this into Terminal:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/Monem-Benjeddou/ScreenBeam/main/install.sh | bash
          \`\`\`

          Or download \`ScreenBeam-mac.zip\`, unzip it, and move ScreenBeam.app to Applications. The app isn't notarized by Apple, so on macOS 15 or later click **Open Anyway** in System Settings › Privacy & Security after the first launch (on macOS 14, right-click → Open).

          **Android** (Android 8 or later): install \`ScreenBeam.apk\` on your phone.

          Then scan the QR code in the Mac window from the phone app. The [README](https://github.com/${{ github.repository }}#readme) has the full guide.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" ScreenBeam-mac.zip ScreenBeam-mac.zip.sha256 ScreenBeam.apk \
            --repo "${{ github.repository }}" --title "ScreenBeam ${TAG#v}" --notes-file notes.md
